version = "0.1.0"
description = "Task Management API using FastAPI and PostgreSQL"
readme = "README.md"
authors = [
    { name = "Anubhav017", email = "Anubhav11071990@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
