services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: task_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sakhicare-local}
      POSTGRES_DB: sakhicare

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sakhicare"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment: &backend-environment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sakhicare-local}
      SECRET_KEY: ${SECRET_KEY:-}
      ALGORITHM: HS256
      AUTO_CREATE_TABLES: "true"
      SESSION_COOKIE_SECURE: "false"
      CHAT_PROVIDER: openai
      EMBEDDING_PROVIDER: openai
      # AI endpoints return 503 until a key is set; database and non-AI workflows remain available.
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4.1-mini}
    volumes:
      - session_key:/run/sakhicare
    ports:
      - "127.0.0.1:${SAKHICARE_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${SAKHICARE_WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "src.documents.worker"]
    environment: *backend-environment
    volumes:
      - session_key:/run/sakhicare:ro
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
volumes:
  session_key:
  postgres_data:
